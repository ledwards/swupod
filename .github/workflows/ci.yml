name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The DB-backed suites (lib/db.test.ts, draft-advance concurrency, auth
    # privilege-freshness) skip themselves when no test DB is reachable, so
    # without this service they silently did not run here — 48 skipped every
    # green build. That is how a pod_players lock-order deadlock reached main:
    # the test that catches it is one of the suites that was skipping.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Typecheck (U6): tsc only checks files without @ts-nocheck, so this
      # gets stricter as headers come off — never weaker.
      - run: npm run typecheck
      # Monotonic @ts-nocheck ratchet (U6): the count can only go down.
      - run: npm run check:ts-ratchet
      # Banned design tells (D2, design refresh): per-file monotonic baselines
      # for off-palette hexes, ALL-CAPS labels, gradient fills, side-stripes,
      # and bounce easing. Existing debt is baselined; new debt fails CI.
      - run: npm run check:design-tells
      - name: Create and migrate the test database
        run: |
          psql postgresql://postgres@localhost:5432/postgres -c 'CREATE DATABASE swupod_test'
          npx tsx scripts/migrate.ts dev --yes
        env:
          POSTGRES_URL: postgresql://postgres@localhost:5432/swupod_test
          DATABASE_URL: postgresql://postgres@localhost:5432/swupod_test
      # Three variables because two different guards exist. Most DB suites read
      # SWUPOD_TEST_DATABASE_URL — deliberately NOT POSTGRES_URL — so that a
      # developer whose shell points at Railway cannot have tests write to it.
      # A couple of route tests instead drive the real handler and so key off
      # POSTGRES_URL/DATABASE_URL. Setting all three is safe HERE and only here:
      # this runner's Postgres is an ephemeral service container that lives and
      # dies with the job, so there is no production URL for them to resolve to.
      # Do not copy this into a local shell — that is the case the split guards
      # exist to prevent.
      #
      # Expect ~2 skipped (local-only OMR photo fixtures). A jump back toward
      # ~48 means the database went missing and the green is hollow.
      - run: npm run test
        env:
          SWUPOD_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/swupod_test
          POSTGRES_URL: postgresql://postgres@localhost:5432/swupod_test
          DATABASE_URL: postgresql://postgres@localhost:5432/swupod_test

  migrations-fresh:
    # Fresh-DB migration guard: every migration must apply from ZERO against
    # an empty database (regeneration is the verification). This is what
    # catches statements that cannot run inside pg's implicit multi-statement
    # transaction — e.g. 044's CREATE INDEX CONCURRENTLY, which silently
    # hard-blocked fresh deploys until the runner learned to execute
    # non-transactional migrations statement-by-statement.
    name: Fresh-DB migration guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:migrations-fresh
        env:
          MIGRATIONS_FRESH_ADMIN_URL: postgresql://postgres@localhost:5432/postgres

  bundle-guard:
    name: Build + bundle-size guard (U5)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Plain `next build` — npm run build's prebuild card fetch is skipped
      # in CI (cards.json is committed and synced by sync-swuapi-cards.yml).
      - run: npx next build
        env:
          JWT_SECRET: ci-build-only-secret
      - run: npm run check:bundle-size

  e2e:
    # Playwright E2E — gating.
    #
    # Nothing ran this suite before, which is exactly how it drifted: eleven
    # specs launched a headed browser (impossible without a display), and the
    # whole thing dialled a default Postgres port when DATABASE_URL was unset.
    # Both were invisible because no job executed them. It was added
    # reporting-only at ~72 failures; those were overwhelmingly stale
    # expectations plus a non-hermetic harness (test-only API routes refused in
    # a production build, socket.io rejecting localhost, a shared test id
    # letting one spec delete another's users), not the mystery cross-run state
    # first blamed for them.
    #
    # The suite is green, so it gates: a test job that cannot fail the build
    # teaches everyone to scroll past it. If it goes red, the fix is the code
    # or the spec — not continue-on-error.
    name: E2E
    runs-on: ubuntu-latest
    # Generous because the config runs CI serially (workers: 1) and retries
    # failures twice, so a single bad spec costs three times its runtime. The
    # parallel local run is ~15min; serial on a slower runner is a different
    # number, and a job killed by its own clock reads as a product failure.
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/swupod_e2e
      POSTGRES_URL: postgresql://postgres@localhost:5432/swupod_e2e
      # `next build` refuses to start with the development fallback secret, and
      # the specs sign their own session cookies with this same value.
      JWT_SECRET: ci-e2e-only-secret
      NEXTAUTH_SECRET: ci-e2e-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: psql postgresql://postgres@localhost:5432/postgres -c 'CREATE DATABASE swupod_e2e'
      - run: npm run migrate:dev
      # Chromium only. The config asks for five browsers under CI; that is five
      # times the bill, and the specs skip themselves off chromium anyway.
      - run: npx playwright install --with-deps chromium
      # Playwright builds and serves the app itself (see webServer in
      # playwright.config.ts) — it must own the server, or it starts a second
      # one on the same port. Retries come from the config (2 under CI): now
      # that this gates, a single flake should not block a PR — but a repeat
      # failure still does.
      - run: npx playwright test --project=chromium --reporter=line
      # The GC promo specs are excluded from the default config (they need a
      # server with the claim window open) and would otherwise never run at all
      # — which is the drift this job exists to stop.
      - run: npm run test:promo:e2e
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
