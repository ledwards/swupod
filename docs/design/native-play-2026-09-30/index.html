<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTP — Native play / design study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efeee9;color:#252723;font:16px/1.5 system-ui,sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #28744e;outline-offset:4px}header.study{padding:18px 4vw;background:#252b28;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px}.study small{color:#b7c8bd}.study a{font-size:13px;margin-left:16px}nav{padding:12px 4vw;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #c9cdc6}nav button{border:0;background:transparent;padding:9px 12px;color:#596159}nav button.active{background:#d7ded5;color:#172b20}main{max-width:1060px;margin:34px auto 60px;padding:0 26px}.annotation{font-size:13px;color:#697167;max-width:760px;margin:0 0 22px}.shell{border:1px solid #b9beb6;min-height:580px;background:#fafbf7;box-shadow:0 16px 40px #172e1610}.apphead{padding:20px 28px;border-bottom:1px solid #d3d8d0;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:650;letter-spacing:.07em}.apphead a{text-decoration:none}.content{padding:38px 42px}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:650;color:#617360;text-transform:uppercase}h1{font-size:38px;font-weight:550;line-height:1.15;letter-spacing:-1.4px;margin:12px 0}h2{font-size:22px;font-weight:550;margin:0 0 8px}p{color:#61685e;margin:10px 0 24px}.resume{display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid #d2d7ce;padding:0 0 28px;margin-bottom:28px}.resume p{margin:5px 0 0}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:32px 0}.tiles.four{grid-template-columns:repeat(4,1fr)}.tile{text-align:left;background:#edf0e8;border:1px solid #c7d0c1;padding:28px 22px;min-height:164px}.tile .symbol{font-size:27px;display:block;margin-bottom:15px;color:#7c8876}.tile b{display:block;font-size:24px;font-weight:550}.tile small{color:#626b5e}.primary,.secondary{min-height:46px;padding:10px 22px;border:1px solid #354f3b;border-radius:3px}.primary{background:#354f3b;color:white}.secondary{background:transparent;color:#354f3b}.textbtn{border:0;background:none;text-decoration:underline;padding:8px;color:#54664e}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:1.25fr 1fr;gap:30px;margin-top:25px}.panel{background:#edf0e8;padding:25px}.deck{display:flex;gap:18px;align-items:center;border-bottom:1px solid #d2d7ce;padding:20px 0}.deck:first-child{padding-top:0}.deck:last-child{border-bottom:0}.thumb{width:68px;height:83px;flex-shrink:0;background:repeating-linear-gradient(135deg,#d0d7c9,#d0d7c9 2px,#e4e8de 2px,#e4e8de 12px);display:grid;place-items:center;color:#77846f;font-size:12px}.deck p{font-size:13px;margin:4px 0}.deck .primary{margin-left:auto}.badge{font-size:12px;color:#62765b}.listrow{padding:18px 0;border-bottom:1px solid #d2d7ce;display:flex;align-items:center;justify-content:space-between;gap:15px}.listrow small{display:block;color:#697366}.quiet{font-size:13px;color:#788071}.buildcards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.placeholder{height:104px;background:#d9ded3;border:1px solid #bcc6b5}.result{text-align:center;padding:35px 0}.result h1{font-size:54px}.result .row{justify-content:center}.waiting{padding:32px 0}.waiting span{display:inline-block;width:12px;height:12px;border:2px solid #7a9372;border-radius:50%;margin-right:8px}.linkbox{padding:15px;background:#e3e8dd;border:1px dashed #a3b099;overflow-wrap:anywhere;font:13px monospace;margin:20px 0}label{font-size:14px}input{accent-color:#354f3b}footer{font-size:12px;color:#697366;margin-top:22px}.screens{display:none}.screens.active{display:block}.note{border-left:2px solid #9aaa8d;padding-left:14px;margin-top:28px;font-size:13px}.devicebar{display:flex;align-items:center;gap:20px;margin-bottom:18px;font-size:13px}.devicebar a{margin-left:auto}.boardlink{display:inline-block;margin-top:12px}.invitepath{font-size:12px;color:#687162;letter-spacing:.06em}.phone.shell{max-width:390px;margin:auto}.phone .content{padding:25px 20px}.phone .tiles,.phone .tiles.four{grid-template-columns:1fr 1fr}.phone .split{grid-template-columns:1fr}.phone .resume{align-items:flex-start;flex-direction:column}.phone h1{font-size:30px}.phone .tile{min-height:130px;padding:20px}.phone .tile b{font-size:22px}.phone .apphead{padding:18px}.phone .deck{flex-wrap:wrap}.phone .deck .primary{margin-left:0}.phone .buildcards{grid-template-columns:repeat(4,1fr)}
@media(max-width:650px){header.study{align-items:flex-start;flex-direction:column;gap:6px}.study a{margin:0 16px 0 0}main{padding:0 14px;margin-top:22px}.content{padding:25px 20px}.tiles,.tiles.four{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.resume{align-items:flex-start;flex-direction:column}h1{font-size:30px}.tile{padding:20px;min-height:130px}.tile b{font-size:22px}.deck{flex-wrap:wrap}.deck .primary{margin-left:0}.apphead{padding:18px}.devicebar{flex-wrap:wrap}.result h1{font-size:40px}}
</style>
<header class="study"><div><strong>Protect the Pod</strong> <small> / Native play · Flow wireframes</small></div><div><a href="board.html">Browser board study ↗</a><a href="board-concept.png">Rendered concept ↗</a></div></header>
<nav id="nav" aria-label="Wireframe screens"></nav><main><div class="devicebar"><label><input type="checkbox" id="phone"> Phone width</label><label><input type="checkbox" id="stats" checked> Show fourth entry: Stats</label><span class="quiet">Interactive wireframes · fictional data</span></div><p class="annotation" id="annotation"></p><div class="shell" id="shell"><div class="apphead"><a href="#home">PROTECT THE POD</a><span>Lee &nbsp; ◉</span></div><div class="content" id="screen"></div></div><footer>Design study, 30 September 2026. Navigation and waiting states are simulated. No game, listing, invitation, or result is created.</footer></main>
<script>
const names={home:'01 Home',decks:'02 Saved decks',build:'03 Deck ready',opponents:'04 Opponents',queue:'05 Queue',invite:'06 Private link',join:'07 Accept invite',result:'08 Result'};
const notes={home:'Three primary ways in. An active session gets priority. Toggle Stats to compare three versus four entries.',decks:'Play begins with a saved limited deck. No return to the pool or builder is required.',build:'The deck is ready: Play is the dominant next action. Export is relegated to a utility.',opponents:'One selected deck, three ways to meet an opponent. Public listings and the queue share availability; opponent decks remain hidden.',queue:'Waiting is explicit and cancellable. Empty public availability never invents a player or an estimated wait.',invite:'Private games are unlisted. The host shares the link out of band; matching restrictions are explicit.',join:'An invitation preserves its context through sign-in and deck selection. The host’s deck identity stays private.',result:'A single completed game ends here. Rematch requires consent from both players; deck editing begins a fresh preparation flow.'};
const btn=(text,to,primary=true)=>`<button class="${primary?'primary':'secondary'}" data-go="${to}">${text}</button>`;
const chosen=()=>`<div class="deck"><div class="thumb">LEADER</div><div><b>Luke · Rebel defense</b><p>SOR · Sealed · 6 packs</p><span class="badge">30 cards · Ready to play</span></div></div>`;
const templates={
home:()=>`<div class="resume"><div><span class="eyebrow">Pick up where you left off</span><h2>Your sealed deck is ready.</h2><p>SOR · Luke · 30 cards</p></div>${btn('Play this deck →','opponents')}</div><span class="eyebrow">From packs to the battlefield</span><h1>What are we playing?</h1><div class="tiles ${document.querySelector('#stats').checked?'four':''}"><button class="tile" data-go="build"><span class="symbol">▥</span><b>Draft</b><small>Pick. Build. Play.</small></button><button class="tile" data-go="build"><span class="symbol">▱</span><b>Sealed</b><small>Open. Build. Play.</small></button><button class="tile" data-go="decks"><span class="symbol">↗</span><b>Play</b><small>Bring a saved deck.</small></button>${document.querySelector('#stats').checked?'<button class="tile" id="statstile"><span class="symbol">▤</span><b>Stats</b><small>See your progress.</small></button>':''}</div><div class="row"><span class="quiet">Other formats &nbsp; · &nbsp; History &nbsp; · &nbsp; Community</span></div><p class="note">Draft and Sealed skip pack creation in this wireframe and jump to a completed example deck. Existing drafting/opening screens are retained for later design.</p>`,
decks:()=>`<span class="eyebrow">Play</span><h1>Choose your deck.</h1><p>Your saved limited decks, ready for another game.</p><div class="deck"><div class="thumb">LEADER</div><div><b>Luke · Rebel defense</b><p>SOR · Sealed · 6 packs · Last played today</p><span class="badge">30 cards · Ready</span></div>${btn('Play →','opponents')}</div><div class="deck"><div class="thumb">LEADER</div><div><b>Vader · Imperial pressure</b><p>SOR · Draft · Built yesterday</p><span class="badge">28 / 30 cards · Finish building</span></div>${btn('Finish deck','build',false)}</div><p class="note">Only the Luke deck is selectable in this mockup. Production filters and eligibility use saved deck data.</p>`,
build:()=>`<span class="eyebrow">Sealed / SOR / Your deck</span><h1>Ready for the table.</h1><div class="split"><div><div class="buildcards">${Array(15).fill('<div class="placeholder"></div>').join('')}</div><p class="quiet">Existing deck-building workspace</p></div><div class="panel">${chosen()}<p>Deck saved. Your next opponent is one step away.</p>${btn('Play this deck →','opponents')}<p class="quiet" style="margin-top:24px">Leader + base selected<br>30-card deck · Legal</p><details><summary class="quiet">Export deck</summary><p class="quiet">Deck JSON · Deck image · Karabast export</p></details></div></div>`,
opponents:()=>`<span class="eyebrow">Play</span><h1>Find your next opponent.</h1><div class="split"><div><div class="panel">${chosen()}${btn('Find opponent →','queue')} <button class="textbtn" data-go="decks">Change deck</button><p class="quiet" style="margin-top:14px">Same set and format · One game</p></div><div class="listrow"><div><b>Playing with a friend?</b><small>Create an unlisted game and share the link.</small></div>${btn('Invite','invite',false)}</div></div><div><h2>Open games</h2><p class="quiet">Compatible with your deck</p><div class="listrow"><div><b>Morgan</b><small>SOR · Sealed · 6 packs</small></div><a class="primary" href="board.html">Join</a></div><div class="listrow"><div><b>Avery</b><small>SOR · Sealed · 6 packs</small></div><a class="secondary" href="board.html">Join</a></div><p class="quiet">Sample listings · opponent decks hidden</p></div></div>`,
queue:()=>`<span class="eyebrow">Find opponent</span><h1>You’re on the table.</h1>${chosen()}<div class="waiting"><span></span> Waiting for a compatible player</div><p>Your game is visible in the public lobby.<br>SOR · Sealed · 6 packs · One game</p><div class="row">${btn('Cancel search','opponents',false)}<a href="board.html" class="textbtn">Preview opponent-found transition →</a></div><p class="note">The preview link simulates a match. Live matchmaking must resolve queue and lobby joins atomically.</p>`,
invite:()=>`<span class="eyebrow">Private game</span><h1>Save a seat for a friend.</h1>${chosen()}<p>Send this link wherever you already talk.</p><div class="linkbox" id="invitelink">Preview invitation: ${location.href.split('#')[0]}#join</div><div class="row"><button class="primary" id="copy">Copy preview link</button>${btn('Preview friend’s view','join',false)}</div><p class="quiet" id="copied" role="status">Unlisted · One opponent</p><label><input type="checkbox" id="relax"> Allow different limited sets or formats</label><p class="quiet">Otherwise, your friend needs a SOR sealed deck from 6 packs.</p><button class="textbtn" data-go="opponents">Cancel invitation</button>`,
join:()=>`<span class="eyebrow">Private invitation</span><h1>Lee saved you a seat.</h1><p>${window.relaxed?'Different limited sets and formats allowed.':'SOR · Sealed · 6 packs.'} One game.</p><div class="invitepath">SIGN IN ✓ &nbsp; → &nbsp; CHOOSE DECK &nbsp; → &nbsp; JOIN</div><div class="panel" style="margin-top:25px">${chosen()}<a class="primary boardlink" href="board.html">Join Lee →</a></div><button class="textbtn" data-go="build">No eligible deck? Build one</button><p class="quiet">The invitation stays attached while you build; its availability is checked again when you return.</p>`,
result:()=>`<div class="result"><span class="eyebrow">Game complete</span><h1>A well-earned victory.</h1><p>You defeated Morgan.<br>SOR · Sealed · Luke · Rebel defense</p><div class="row"><button class="primary" id="rematch">Request rematch</button>${btn('Find another opponent','queue',false)}</div><p id="rematchstatus" role="status" class="quiet">Result saved with the deck you played.</p><button class="textbtn" data-go="build">Adjust deck</button><button class="textbtn" data-go="home">Home</button></div>`};
let current='home';function render(){current=location.hash.slice(1)||'home';if(!templates[current])current='home';document.querySelector('#screen').innerHTML=templates[current]();document.querySelector('#annotation').textContent=notes[current];document.querySelector('#nav').innerHTML=Object.entries(names).map(([k,v])=>`<button class="${k===current?'active':''}" data-go="${k}">${v}</button>`).join('');document.querySelector('#relax')?.addEventListener('change',e=>window.relaxed=e.target.checked);if(document.querySelector('#relax'))document.querySelector('#relax').checked=!!window.relaxed;document.querySelector('#copy')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href.split('#')[0]+'#join');document.querySelector('#copied').textContent='Preview link copied — opens this local wireframe only.'}catch{document.querySelector('#copied').textContent='Select and copy the preview link above.'}});document.querySelector('#rematch')?.addEventListener('click',e=>{e.target.disabled=true;document.querySelector('#rematchstatus').textContent='Waiting for Morgan to accept… (simulated)'});document.querySelector('#statstile')?.addEventListener('click',()=>{document.querySelector('#annotation').textContent='Stats is a navigation placement study; its existing content is outside this wireframe.'});}document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t)location.hash=t.dataset.go});window.addEventListener('hashchange',render);document.querySelector('#stats').onchange=render;document.querySelector('#phone').onchange=e=>document.querySelector('#shell').classList.toggle('phone',e.target.checked);render();
</script></html>
