<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Play — layout comps</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--theme-canvas:#141128;--theme-surface:#1c1930;--theme-surface-raised:#252239;--theme-text:#f5f3ef;--theme-text-muted:#c0c9ce;--theme-accent:#c7b0fa;--theme-on-accent:#10151b;--theme-border:#859399}*{box-sizing:border-box}body{margin:0;background:var(--theme-canvas);color:var(--theme-text);font:18px Barlow,sans-serif}button,summary{cursor:pointer}button{font:600 18px Barlow;color:inherit;background:var(--theme-surface-raised);border:1px solid var(--theme-border);border-radius:8px;padding:12px 18px}button:focus-visible,summary:focus-visible{outline:3px solid var(--theme-accent);outline-offset:4px}button[aria-pressed=true]{border:2px solid var(--theme-accent)}.review{padding:12px 32px;display:flex;align-items:center;gap:12px;background:var(--theme-surface)}.review span{margin-left:auto;color:var(--theme-text-muted);font-size:15px}.stage{min-height:calc(100vh - 70px);background:linear-gradient(0deg,var(--theme-canvas),transparent),url('https://www.protectthepod.com/table-environments/purrgil.webp') center top/cover}header{height:140px;display:flex;align-items:center;justify-content:center;position:relative}header img{position:absolute;left:48px;top:15px;width:112px}h1{font-size:32px}main{max-width:1280px;margin:16px auto;padding:0 40px 60px}.flow{display:grid;grid-template-columns:1fr 1fr;gap:32px}h2{font-size:22px;margin:0 0 16px}h3{font-size:20px;margin:0 0 12px}p{margin:8px 0;color:var(--theme-text-muted)}.deck{height:340px;position:relative;border:1px solid var(--theme-border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;justify-content:end;padding:24px;isolation:isolate}.deck img{position:absolute;left:0;top:-30%;width:100%;height:160%;object-fit:cover;z-index:-2}.deck:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--theme-surface) 0%,transparent 100%);z-index:-1}.deck b{font-size:28px}.deck button{position:absolute;top:16px;right:16px}.context{margin:16px 0;font-size:16px}.context summary{color:var(--theme-text-muted)}.context .options{padding:12px;background:var(--theme-surface);display:flex;gap:8px;flex-wrap:wrap}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{height:112px;position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:end;justify-content:start;text-align:left;padding:14px}.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.55}.tile:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--theme-surface),transparent);z-index:-1}.ai{margin-top:28px}.ai .tile{height:130px}.launch{width:100%;margin-top:24px;background:var(--theme-accent);color:var(--theme-on-accent);border:none;min-height:56px}.notice{font-size:15px;text-align:center}.variant-b .flow{display:block;max-width:1000px;margin:auto}.variant-b .deck{height:136px;padding-left:200px;justify-content:center}.variant-b .deck img{width:180px;top:-50%;height:200%}.variant-b .deck:after{background:linear-gradient(90deg,transparent,var(--theme-surface) 190px)}.variant-b .deck b{font-size:25px}.variant-b .deck button{top:44px}.variant-b .opponent{margin-top:28px}.variant-b .tile{height:105px}.variant-b .ai{margin-top:24px}.variant-b .launch{max-width:360px;display:block;margin:28px 0 0 auto}.hidden{display:none!important}@media(max-width:700px){.review{padding:12px;flex-wrap:wrap}.review span{width:100%;margin:0}main{padding:0 16px 32px}.flow{display:block}header{height:100px}header img{width:75px;left:16px}.deck{height:240px}.opponent{margin-top:24px}.choices{gap:8px}.tile{font-size:16px;padding:10px}.variant-b .deck{height:180px;padding:20px}.variant-b .deck img{width:100%;top:-40%}.variant-b .deck:after{background:linear-gradient(0deg,var(--theme-surface),transparent)}.variant-b .deck button{top:12px}.variant-b .deck b{margin-top:55px;font-size:22px}}
.deck img{width:125%;height:auto;left:-12.5%;top:-65%}.variant-b .deck img{width:300px;height:auto;left:-40px;top:-100px}.tile img{transform:scale(1.7);object-position:50% 28%}.tile img[src*="010.webp"]{object-position:50% 20%}@media(max-width:700px){.deck img,.variant-b .deck img{width:125%;height:auto;left:-12.5%;top:-65%}}
.opponent{padding:20px;border:1px solid var(--theme-border);border-radius:16px;background:var(--theme-surface)}.ai{padding-top:24px;border-top:1px solid var(--theme-border)}
.deck-area,.opponent,.ai{position:relative}.panel-label{position:absolute;top:0;left:16px;transform:translateY(-50%);margin:0;padding:2px 8px;background:var(--theme-surface);border-radius:4px;font-size:14px;font-weight:600;z-index:3}.ai{margin-top:28px}
</style>
<div class="review"><strong>Play comps</strong><button id="a" aria-pressed="true" onclick="variant('a')">A · Side by side</button><button id="b" aria-pressed="false" onclick="variant('b')">B · Compact stack</button><span>Design preview · no games will start</span></div>
<div class="stage"><header><img src="https://www.protectthepod.com/ptp_logo400.png" alt="Protect the Pod"><h1>Play</h1></header><main><div class="flow"><section class="deck-area"><h2 class="panel-label">Your deck</h2><div class="deck"><img src="https://karabast-data.s3.amazonaws.com/cards/HMW/en/standard/large/010.webp" alt=""><b>Tarfful Yellow</b><p>Great Grass Plains · 30 cards</p><p>Homeworlds · Sealed 6-pack</p></div></section><section class="opponent"><h2 class="panel-label">Opponent</h2><div class="choices modes"><button class="tile" onclick="mode(this,'Matchmaking')"><img src="https://www.protectthepod.com/expansion-art/hmw.png" alt="">Matchmaking</button><button class="tile" onclick="mode(this,'Private')"><img src="https://www.protectthepod.com/expansion-art/ash.png" alt="">Private</button><button class="tile" aria-pressed="true" onclick="mode(this,'vs AI')"><img src="https://cdn.starwarsunlimited.com//card_0302449_EN_Tactical_Droid_Commander_1811cfbfa5.png" alt="">vs AI</button></div><section class="ai"><h3 class="panel-label">AI deck</h3><div class="choices"><button class="tile" aria-pressed="true" onclick="pick(this)"><img src="https://www.protectthepod.com/expansion-art/hmw.png" alt="">From its sealed pool</button><button class="tile" onclick="pick(this)"><img src="https://karabast-data.s3.amazonaws.com/cards/HMW/en/standard/large/010.webp" alt="">Mirror</button><button class="tile" onclick="pick(this)">Choose a deck</button></div></section><button class="launch" onclick="document.querySelector('.notice').textContent='Preview only — your game would start here.'">Play vs AI</button><p class="notice" aria-live="polite"></p></section></div></main></div>
<script>function variant(v){document.body.classList.toggle('variant-b',v==='b');for(const id of ['a','b'])document.getElementById(id).setAttribute('aria-pressed',id===v);history.replaceState(null,'','#'+v)}function mode(el,label){document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b===el));document.querySelector('.ai').classList.toggle('hidden',label!=='vs AI');document.querySelector('.launch').textContent=label==='vs AI'?'Play vs AI':label==='Private'?'Create private game':'Find a match'}function pick(el){el.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===el))}variant(location.hash==='#b'?'b':'a')</script></html>
