[build]
# Force Railway to use the nixpacks builder, not its newer Railpack/mise
# default. Required because the Import Pool whole-table extraction relies
# on a Python OMR sidecar (scripts/omr/extract_for_node.py); only nixpacks
# honors our nixpacks.toml which lists `python311` in nixPkgs. Without
# this, the prod container has no python3, the sidecar can't spawn, and
# extract silently falls back to the legacy multi-sample path which
# produces wrong section bounds — broken section crops in Step 2.
builder = "NIXPACKS"

[deploy]
releaseCommand = "node scripts/migrate.js prod --yes"
startCommand = "npm start"
# Zero-downtime deploys. Without a healthcheck, Railway cuts traffic over to
# the new container the moment the process starts — but `npx tsx server.ts`
# transpiles at boot and the server needs a few seconds before it actually
# serves. Requests landing in that gap (e.g. a full-page navigation) get
# Railway's "Application failed to respond" page instead of a response.
# Pointing at /api/health (which also verifies the DB connection) makes
# Railway keep the old container live until the new one is genuinely ready.
healthcheckPath = "/api/health"
healthcheckTimeout = 300
