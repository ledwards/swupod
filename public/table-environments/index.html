<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table environments</title><link rel="stylesheet" href="table-environments.css"><style>*{box-sizing:border-box}body{margin:0;background:#101516;color:#eee9de;font:16px/1.5 Barlow,sans-serif}main{max-width:1500px;padding:32px 24px;margin:auto}h1{font-size:36px;font-weight:400}p{color:#bcc4b9}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}figure{margin:0;border:1px solid #454d45;border-radius:6px;overflow:hidden}figcaption{padding:12px 16px}a{color:inherit}a:focus-visible{outline:3px solid #dcf4c7;outline-offset:3px}@media(max-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.gallery{grid-template-columns:1fr}}</style></head><body><main><h1>Table environments</h1><p>Perpendicular views, rectangular playing surfaces, and a narrow glimpse of the surrounding room.</p><p><a href="palettes.html">View theme palettes and controls</a></p><div class="gallery" id="gallery"></div><p id="status" role="status"></p></main><script>
fetch('manifest.json').then(r=>{if(!r.ok)throw Error('Manifest unavailable');return r.json()}).then(({themes})=>{for(const theme of themes){const figure=document.createElement('figure');figure.style.setProperty('--table-scale-x',theme.framing.scaleX);figure.style.setProperty('--table-scale-y',theme.framing.scaleY);figure.style.setProperty('--table-origin-y',theme.framing.originY+'%');figure.style.setProperty('--table-origin-x',theme.framing.originX+'%');figure.style.setProperty('--table-origin-x',theme.framing.originX+'%');figure.style.setProperty('--table-origin-x',theme.framing.originX+'%');const preview=document.createElement('div');preview.className='table-environment-preview';const img=document.createElement('img');img.src=theme.image;img.alt=theme.name;preview.append(img);const caption=document.createElement('figcaption');const a=document.createElement('a');a.href=theme.image;a.textContent=theme.name;caption.append(a);figure.append(preview,caption);document.querySelector('#gallery').append(figure)}}).catch(e=>document.querySelector('#status').textContent=e.message);
</script></body></html>
